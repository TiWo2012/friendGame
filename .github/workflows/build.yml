name: Build

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (Clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install X11 development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxext-dev

      - name: Configure
        run: cmake --preset linux-clang-release

      - name: Build
        run: cmake --build build/linux-clang-release

  macos:
    name: macOS (Apple Clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset macos-clang-release

      - name: Build
        run: cmake --build build/macos-clang-release

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build build/windows-msvc --config Release
